<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Browser</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login">
  <div class="login-card"><div class="logo">◈</div><h1>PRIVATE BROWSER</h1><p>Navigation distante et temporaire</p>
    <input id="password" type="password" placeholder="Mot de passe du navigateur" autocomplete="current-password">
    <button id="loginBtn">Entrer</button><small id="loginError"></small>
  </div>
</div>
<header>
  <div class="brand"><span class="logo">◈</span><b>PRIVATE BROWSER</b><span class="private">● PRIVÉ</span></div>
  <div class="tabs"><div class="tab">🌐 <span>Nouvel onglet</span></div><button id="newTab" title="Nouvelle session">+</button></div>
</header>
<nav>
  <button id="back" title="Précédent">←</button><button id="forward" title="Suivant">→</button><button id="reload" title="Actualiser">↻</button>
  <form id="addressForm"><span>🔒</span><input id="address" value="https://www.google.com/" aria-label="Adresse ou recherche"><button>Aller</button></form>
  <button id="home" title="Accueil Google">⌂</button><button id="close" title="Fermer la session">✕</button>
</nav>
<section class="quick-sites" aria-label="Sites favoris">
  <span>Accès rapide :</span>
  <button type="button" data-url="https://chatgpt.com/">ChatGPT</button>
  <button type="button" data-url="https://claude.ai/">Claude</button>
  <button type="button" data-url="https://grok.com/">Grok</button>
  <button type="button" id="geforceDirect">GeForce NOW ↗</button>
</section>
<main><div class="screen-wrap"><img id="screen" alt="Écran du navigateur distant"><div id="loading">Connexion au navigateur…</div></div></main>
<footer><span id="status">Prêt</span><span>Session temporaire · Expiration après 30 min d'inactivité</span></footer>
<script src="app.js"></script>
</body></html>
